version: '3.9'

services:
  app:
    build:
      context: .
      target: development
      # Use BuildKit for faster, more efficient builds
      cache_from:
        - frontendtrading_app_dev:latest
    container_name: frontendTrading_app_dev
    ports:
      - "5173:5173"
    volumes:
      # Source code bind mount for hot reload
      - .:/app
      # Named volume for node_modules (prevents host conflicts)
      - node_modules:/app/node_modules
    environment:
      # Vite environment variables (can be overridden via .env file)
      - NODE_ENV=development
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3000}
    restart: unless-stopped
    # Enable stdin and tty for interactive debugging
    stdin_open: true
    tty: true
    # Custom network for better isolation
    networks:
      - frontend
    # Health check (inherits from Dockerfile but can be customized)
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

networks:
  frontend:
    driver: bridge
    name: frontendTrading_network

volumes:
  # Named volume for node_modules
  node_modules:
    name: frontendTrading_node_modules
